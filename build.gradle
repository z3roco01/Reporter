plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modApi ("com.github.z3roco01:composed:${project.composed_version}")

    include modImplementation("net.dv8tion:JDA:${project.jda_version}") {
        // exclude audio libraries, to cut down jar size
        exclude module: 'opus-java'
        exclude module: 'tink'
    }
	include modImplementation("net.sf.trove4j:core:3.1.0")
	include modImplementation("org.apache.commons:commons-collections4:4.4")
	include modImplementation("org.slf4j:slf4j-api:2.0.17")
	include modImplementation("com.neovisionaries:nv-websocket-client:2.14")
	include modImplementation("com.fasterxml.jackson.core:jackson-core:2.18.3")
	include modImplementation("com.fasterxml.jackson.core:jackson-databind:2.18.3")
	include modImplementation("com.fasterxml.jackson.core:jackson-annotations:2.18.3")
	include modImplementation("com.squareup.okhttp3:okhttp:4.12.0")
	include modImplementation("com.squareup.okio:okio-jvm:3.6.0")
	include modImplementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.10")

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}